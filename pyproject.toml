[project]
name = "salao-conecta"
version = "0.1.0"
description = "Sistema de gerenciamento para salões de beleza"
authors = [
    { name = "João Vitor", email = "joaovitor.monteiro.188@gmail.com" },
]
license = { text = "MIT" }
readme = "README.md"
keywords = ["salao", "beleza", "gerenciamento", "django"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: Django",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.12"
dependencies = [
    "django==5.2.16",
    "djangorestframework==3.18.0",
    "pillow==12.3.0",
    "psycopg2>=2.9.10",
    "python-decouple>=3.8",
    "requests==2.34.2",
    "djangorestframework-simplejwt>=5.5.1,<6.0.0",
    "djangorestframework-stubs==3.18.0",
    "django-cors-headers>=4.9.0",
    "drf-spectacular>=0.30.0",
    "django-filter>=26.1",
    "markdown>=3.10.3",
]
